<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jy — Convert between JSON and YAML</title>
    <meta name="description" content="A fast, zero-config CLI tool to convert between JSON and YAML. Cross-platform, zero dependencies, ships as a single binary." />
    <meta property="og:title" content="jy — Convert between JSON and YAML" />

    <meta property="og:url" content="https://bilalshareef.github.io/jy/" />
    <link rel="icon" type="image/svg+xml" href="/jy/favicon.svg" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
